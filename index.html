<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Cartão de Contato</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans&display=swap" rel="stylesheet">

    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</head>

<body>
    <section class="cartao">
        <div class="cartao-header"></div>
        <div class="usuario-foto"></div>
        <section class="area-usuario">
            <div class="principal">
                <h1>Matheus Ribeiro</h1>
                <p>LEGO Designer</p>
            </div>
            <div class="informacoes">
                <div class="info-linha">
                    <span class="categoria">Idade:</span>
                    <span class="valor">22 Anos</span>
                </div>

                <hr>

                <div class="info-linha">
                    <span class="categoria">Email:</span>
                    <span class="valor">Matheus Ribeiro</span>
                </div>

                <hr>

                <div class="info-linha">
                    <span class="categoria">Telefone:</span>
                    <span class="valor">(15) 11111-1111</span>
                </div>

                <hr>

                <div class="info-linha">
                    <span class="categoria">Endereço:</span>
                    <span class="valor">Itapetininga, SP</span>
                </div>

                <hr>

                <div class="info-linha">
                    <span class="categoria">Especialidade:</span>
                    <span class="valor">Model Design</span>
                </div>
            </div>

            <div class="redes-sociais">
                    <button class="botao github">Github<ion-icon name="logo-github"></ion-icon></button>
                    <button class="botao linkedin">Linkedin<ion-icon name="logo-linkedin"><ion-icon></button>
                    <button class="botao portfolio">Portfólio<ion-icon name="folder"></ion-icon></button>
                </div>

            <div class="btn-principal">
                <button>Entre em Contato</button>
            </div>
        </section>
    </section>
</body>

</html>
